<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Import Progress preview · Veynor</title>
  <link rel="stylesheet" href="/css/theme.css"/>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f6fb;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }
    .preview-hint {
      padding: 28px 32px;
      color: #667085;
      font-size: 14px;
    }
  </style>
  <script src="/js/import-progress.js" defer></script>
</head>
<body>
  <p class="preview-hint">Import progress modal preview — Order Import page</p>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const progress = window.VeynorImportProgress;
      if (!progress) return;
      progress.open({
        title: "Importing Orders",
        description:
          "Please keep this window open while Veynor processes your orders. You can follow the progress below.",
        total: 24,
        type: "orders"
      });
      progress.update({
        completed: 14,
        imported: 13,
        skipped: 1,
        failed: 0,
        reference: "SO-10482 · Bellstone Living"
      });
    });
  </script>
</body>
</html>
